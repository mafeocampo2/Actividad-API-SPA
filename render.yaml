# Despliegue en Render (Blueprint): crea la API y la base de datos PostgreSQL.
# En Render: New → Blueprint → elige este repositorio. Despliega la rama main.
services:
  - type: web
    name: mi-app-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    # Aplica las migraciones y el seed (no duplica nada) antes de arrancar
    startCommand: npm run db:setup && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Render usa UTC: sin esto, "hoy" y los turnos pasados se calculan 5 horas adelantados
      - key: TZ
        value: America/Bogota
      - key: DATABASE_URL
        fromDatabase:
          name: mi-app-db
          property: connectionString

databases:
  - name: mi-app-db
    plan: free
    databaseName: miapp
    user: miapp
